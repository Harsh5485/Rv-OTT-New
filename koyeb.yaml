# Koyeb deployment configuration
name: rv-ott-bot
type: worker
instance-type: free
env:
  - key: API_ID
    value: ${API_ID}
  - key: API_HASH
    value: ${API_HASH}
  - key: BOT_TOKEN
    value: ${BOT_TOKEN}
  - key: MONGO_URI
    value: ${MONGO_URI}
  - key: DATABASE_NAME
    value: rvott_db
ports:
  - port: 80
    protocol: http
routes:
  - path: /
    port: 80
regions:
  - fra # Frankfurt region