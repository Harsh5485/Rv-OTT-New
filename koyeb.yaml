# Koyeb deployment configuration
name: rv-ott-bot
region: was
instance-type: free
ports:
  - port: 8080
    protocol: http
routes:
  - path: /*
    target-port: 8080
env:
  - key: PYTHONPATH
    value: .
  - key: PORT
    value: "8080"
build:
  commands:
    - pip install -r requirements.txt
run:
  command: python bot.py