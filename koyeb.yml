services:
  - name: rv-ott-bot
    image: python:3.9-slim
    ports:
      - "80:80"
    env:
      - name: API_ID
        value: ${API_ID}
      - name: API_HASH
        value: ${API_HASH}
      - name: BOT_TOKEN
        value: ${BOT_TOKEN}
      - name: SESSION_STRING
        value: ${SESSION_STRING}
      - name: OWNER_ID
        value: ${OWNER_ID}
      - name: DB_URL
        value: ${DB_URL}
    volumes:
      - name: app-storage
        mount_path: /app/data
    health_check:
      http: /
      timeout: 30